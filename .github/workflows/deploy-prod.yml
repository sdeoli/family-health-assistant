name: Deploy to prod

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # GitHub Environment with required reviewers = manual approval gate
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::147956725112:role/github-actions-deploy-role
          aws-region: us-east-1

      - run: npx cdk deploy FamilyHealthProd --require-approval never
